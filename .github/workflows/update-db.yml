name: Update sprite database

# Rebuilds db/sprites.json, the map lists and the "only what the base lacks"
# packs from the forks listed in sources.json.

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday
  workflow_dispatch:
    inputs:
      packs:
        description: "Also rebuild the packs (packs/hardlight …)"
        type: boolean
        default: true
  push:
    paths:
      - "tools/**"
      - "sources.json"
      - ".github/workflows/update-db.yml"

permissions:
  contents: write

concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Decide what to rebuild
        id: what
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.packs }}" = "true" ]; then
            echo "packs=true" >> "$GITHUB_OUTPUT"
          else
            echo "packs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the forks
        env:
          PACKS: ${{ steps.what.outputs.packs }}
        run: |
          set -e
          mkdir -p /tmp/src
          python3 -c '
          import json
          for s in json.load(open("sources.json"))["sources"]:
              print(s["id"], s["repo"], s.get("branch", "master"))
          ' > /tmp/src/list.txt
          while read id repo branch; do
            d="/tmp/src/$id"
            git clone -q --filter=blob:none --no-checkout --depth 1 --branch "$branch" "https://github.com/$repo" "$d"
            if [ "$PACKS" = "true" ]; then
              git -C "$d" sparse-checkout set --no-cone '/Resources/Prototypes/' '/Resources/migration.yml' '/Resources/Textures/'
            else
              git -C "$d" sparse-checkout set --no-cone '/Resources/Prototypes/' '/Resources/migration.yml'
            fi
            git -C "$d" checkout -q
            git -C "$d" ls-tree -r --name-only HEAD Resources/Maps > "$d.maps.txt"
            git -C "$d" rev-parse HEAD > "$d.commit"
          done < /tmp/src/list.txt

      - name: Build database and map lists
        run: |
          set -e
          python3 - <<'EOF'
          import json, subprocess
          srcs = json.load(open("sources.json"))["sources"]
          commit = lambda s: open(f"/tmp/src/{s['id']}.commit").read().strip()
          main = srcs[0]
          cmd = ["python3", "tools/build_db.py", f"/tmp/src/{main['id']}/Resources", "db/sprites.json",
                 "--repo", main["repo"], "--commit", commit(main)]
          for s in srcs[1:]:
              cmd += ["--extra", f"/tmp/src/{s['id']}/Resources", s["repo"], commit(s)]
          subprocess.run(cmd, check=True)
          for s in srcs:
              maps = sorted(l.strip().replace("Resources/", "", 1)
                            for l in open(f"/tmp/src/{s['id']}.maps.txt") if l.strip().endswith(".yml"))
              with open(f"db/maps-{s['id']}.json", "w") as fh:
                  json.dump({"repo": s["repo"], "commit": commit(s), "maps": maps}, fh, indent=0)
          EOF

      - name: Rebuild packs
        if: steps.what.outputs.packs == 'true'
        run: |
          set -e
          python3 - <<'EOF'
          import json, shutil, subprocess, os
          for s in json.load(open("sources.json"))["sources"]:
              if not s.get("pack"):
                  continue
              out = s["pack"]
              shutil.rmtree(out, ignore_errors=True)
              bases = [f"/tmp/src/{b}/Resources/Textures" for b in s.get("packBase", [])]
              subprocess.run(["python3", "tools/packtool.py", "diff", f"/tmp/src/{s['id']}/Resources/Textures", out,
                              "--base", *bases], check=True)
          EOF

      - name: Index packs and maps
        run: |
          python3 tools/packtool.py index packs/*/
          python3 - <<'EOF'
          import json, os
          maps = sorted(f for f in os.listdir("maps") if f.endswith(".yml")) if os.path.isdir("maps") else []
          json.dump({"maps": maps}, open("maps/index.json", "w"), indent=2)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A db packs maps
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "Update sprite database"
          git push
